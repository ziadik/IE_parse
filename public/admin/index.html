<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>IE Parser — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header>
    <h1>🛠 IE Parser Admin</h1>
    <nav>
      <button data-tab="cache" class="active">Cache</button>
      <button data-tab="bif">BIF</button>
      <button data-tab="tests">Tests</button>
      <button data-tab="config">Config</button>
    </nav>
  </header>

  <main>
    <!-- Cache -->
    <section id="tab-cache" class="tab active">
      <h2>Кэш областей</h2>
      <button id="cache-refresh">↻ Обновить</button>
      <table id="cache-table">
        <thead>
          <tr>
            <th>Область</th>
            <th>BIF</th>
            <th>Статус</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="cache-details"></div>
    </section>

    <!-- BIF -->
    <section id="tab-bif" class="tab">
      <h2>Содержимое BIF</h2>
      <p>Раздел в разработке.</p>
    </section>

    <!-- Tests -->
    <section id="tab-tests" class="tab">
      <h2>Тесты</h2>
      <p>Раздел в разработке.</p>
    </section>

    <!-- Config -->
    <section id="tab-config" class="tab">
      <h2>Конфигурация</h2>
      <pre id="config-view">загрузка…</pre>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
